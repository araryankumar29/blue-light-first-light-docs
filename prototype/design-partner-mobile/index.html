function barChart(title,vals,labels){
  var max=Math.max.apply(null,vals)*1.1, W=150, H=110, bw=(W-12)/vals.length;
  var bars=vals.map(function(v,i){
    var bh=Math.round((v/max)*(H-26)), x=6+i*bw+3, y=H-18-bh;
    return '<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+(bw-6).toFixed(1)+'" height="'+bh+'" rx="5" fill="'+(i===vals.length-1?'#8E6CEF':'#FFC48A')+'"/><text x="'+(x+(bw-6)/2).toFixed(1)+'" y="'+(H-4)+'" font-size="9" text-anchor="middle" fill="currentColor" opacity=".7">'+esc(labels[i])+'</text>';
  }).join('');
  return '<div class="chart"><div class="lbl">'+esc(title)+'</div><svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(title)+' approval turnaround" style="margin-top:6px;color:var(--ink)">'+bars+'</svg><div class="muted small">Avg '+ (vals.reduce(function(a,b){return a+b;},0)/vals.length).toFixed(1)+' days</div></div>';
}

function renderSheet(){
  var host=$('#sheetHost');
  if(!S.sheet){ host.innerHTML=''; return; }
  host.innerHTML='<div class="sheetwrap" data-a="close-bg"><div class="sheet enter" role="dialog" aria-modal="true"><div class="grab"></div>'+sheetInner()+'<button class="btn btn-line" data-a="close" style="margin-top:10px">Close</button></div></div>';
}

/* ---------- render ---------- */
function render(){
  var cur=S.stack.length?S.stack[S.stack.length-1]:{v:S.tab};
  if(!S.authed){ cur={v:'signin'}; }
  renderTop(cur);
  renderTabs();
  var html='';
  if(!S.authed) html=screenSignin();
  else switch(cur.v){
    case 'home': html=screenHome(); break;
    case 'tasks': html=screenTasks(); break;
    case 'projects': html=screenProjects(); break;
    case 'messages': html=screenMessages(); break;
    case 'more': html=screenMore(); break;
    case 'project': html=screenProject(cur.id); break;
    case 'meeting': html=screenMeeting(cur.id); break;
    case 'meetings': html=screenMessages(); break;
    case 'deliv': html=screenDeliv(); break;
    case 'pay': html=screenPay(); break;
    case 'newclaim': html=screenNewClaim(); break;
    case 'claim': html=screenClaim(cur.id); break;
    default: html=screenHome();
  }
  $('#main').innerHTML='<div>'+html+'</div>';
  $('#main').scrollTop=0;
  renderSheet();
}

/* ---------- actions ---------- */
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function act(a,el){
  var d=el.dataset, id=d.id;
  switch(a){
    case 'signin': S.authed=true; S.tab='home'; S.stack=[]; toast('Signed in'); break;
    case 'pw': S.pw=!S.pw; break;
    case 'tab': setTab(d.t); return;
    case 'open':
      if(d.v==='meetings'){ S.tab='messages'; S.stack=[]; render(); return; }
      if(d.v==='pay' || d.v==='deliv' || d.v==='newclaim' ){ go(d.v); return; }
      go(d.v,d.id); return;
    case 'back': back(); return;
    case 'urgent': { var u=URGENT.filter(function(x){return x.id===d.id;})[0]; if(u&&u.go){ if(u.go[0]==='pay') go('pay'); else go(u.go[0],u.go[1]); } return; }
    case 'toggle-meet': S.meetOpen=!S.meetOpen; break;
    case 'pin': PINNED=TASKS[0].title; toast('Pinned: '+TASKS[0].title); break;
    case 'logout': S.authed=false; S.stack=[]; S.tab='home'; toast('Logged out'); break;
    case 'close': closeSheet(); return;
    case 'sheet': openSheet(d.k,{id:d.id,p:d.p}); return;
    case 'taskopen': {
      var t=TASKS.filter(function(x){return x.id===d.id;})[0];
      if(t.type==='meeting') go('meeting',t.ref);
      else openSheet('props',{id:t.id});
      return;
    }
    case 'calday': S.calSel=+d.d; break;
    case 'tick': { var dv=dById(d.id); dv.ticked=el.checked; if(dv.ticked){ var m=MEET[0]; dv.due=m.when; } toast(dv.ticked?'Deadline copied from the meeting time':'Type your own deadline'); break; }
    case 'send-deliv': { var dd=dById(d.id); var typed=val('dl-'+d.id); if(!dd.ticked&&!typed.trim()){ toast('Type a deadline first'); return; } dd.due=dd.ticked?dd.due:typed; dd.sent=true; PAST_SUB.unshift({t:dd.task+' · '+dd.proj,d:'Now',to:dd.to}); toast('Sent to '+dd.to); break; }
    case 'm-approve': { var mm=mById(d.id); mm.people.forEach(function(p){ if(p.n===P.name) p.st='approved'; }); mm.mine='approved'; mm.log.push('You approved this meeting.'); toast('Approved'); break; }
    case 'mchange-send': { var mc=mById(d.id); mc.change={date:val('mc-date'),time:val('mc-time'),region:val('mc-reg')}; mc.people.forEach(function(p){ p.st=(p.n===P.name)?'approved':'waiting'; }); mc.log.push('Change requested. Everyone tagged must approve.'); closeSheet(); toast('Change sent to everyone tagged'); break; }
    case 'mhand-send': { var mh=mById(d.id); mh.handed=val('mh-who'); mh.log.push('Handed over to '+mh.handed+'. Design Head notified.'); closeSheet(); toast('Handed over. Design Head notified'); break; }
    case 'mdecline-send': { var md=mById(d.id); var why=val('md-why').trim(); if(!why){ toast('A written reason is required'); return; } md.log.push('Declined: '+why+' · logged for the sales representative, Sales Head and Design Head.'); closeSheet(); toast('Decline logged'); break; }
    case 'done-submit': { var dn=mById(d.id); dn.done=true; dn.agenda=val('dn-agenda'); if(document.getElementById('dn-book').checked){ MEET.push({id:'m'+(MEET.length+1),title:'Next meeting · '+dn.title,when:'To be booked',len:'60 min',link:'',agenda:dn.agenda,organiser:P.name,mine:'approved',people:[{n:P.name,st:'approved'}],log:['Awaiting approval from everyone tagged.'],change:null,done:false,handed:null}); } closeSheet(); toast('Meeting closed · project history updated'); break; }
    case 'create-save': { var desc=val('ct-desc').trim(), date=val('ct-date'); if(!desc||!date){ toast('Description and date are required'); return; } DELIV.push({id:'d'+(DELIV.length+1),proj:PROJ.filter(function(p){return p.id===val('ct-proj');})[0].name,client:'',task:desc,due:date,to:'Design Head',sent:false,ticked:false}); closeSheet(); toast('Task created · now in Deliverables'); break; }
    case 'sched-send': { var pj=pById(d.id); MEET.push({id:'m'+(MEET.length+1),title:val('sc-t'),when:val('sc-d')+' · '+val('sc-tm'),len:'60 min',link:'',agenda:'',organiser:P.name,mine:'approved',people:[{n:P.name,st:'approved'}],log:['Sent for approval to everyone tagged.'],change:null,done:false,handed:null}); closeSheet(); toast('Meeting sent for approval'); break; }
    case 'stagefwd': { var sp=pById(d.id); if(sp.stage>=14){ toast('Already at the last stage'); return; } sp.approvals.push({t:'Move to stage '+(sp.stage+1)+' · waiting approval',st:'waiting'}); toast('Stage change sent for approval'); break; }
    case 'upload': { var up=pById(d.id); toast(d.k+' sent to the Design Head first. Nothing reaches the client directly.'); return; }
    case 'craddon': openSheet('craddon',{id:d.id,p:d.p}); return;
    case 'crapprove': openSheet('crapprove',{id:d.id,p:d.p}); return;
    case 'craddon-send': { var pc=pById(d.p), cc=pc.cr.filter(function(x){return x.id===d.id;})[0]; var pr=val('ca-price').trim(); if(!pr){ toast('Add a price first'); return; } cc.addon=pr; closeSheet(); toast('Add-on sent to Design Head'); break; }
    case 'crapprove-send': { var pc2=pById(d.p), cc2=pc2.cr.filter(function(x){return x.id===d.id;})[0]; var w=val('cr-words').trim(); if(!w){ toast('Record what the client said'); return; } cc2.approved=w; closeSheet(); toast('Approved for '+cc2.from+' · logged'); break; }
    case 'access': { var ap=pById(d.id); ap.access=ap.access.filter(function(a){return a.n!==d.n;}); ap.team.push(d.n); toast('Access granted · logged'); break; }
    case 'pay-approve': { var pa=PAY.made.filter(function(x){return x.id===d.id;})[0]; pa.st='approved'; var n=new Date(); pa.ts='25 Nov · '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); closeSheet(); toast('Approved · timestamp recorded'); break; }
    case 'pay-dispute': { var pdv=PAY.made.filter(function(x){return x.id===d.id;})[0]; var why2=val('pd-why').trim(); if(!why2){ toast('A written reason is required'); return; } pdv.st='disputed'; closeSheet(); toast('Dispute sent back to the MD'); break; }
    case 'claim-send': { var amt=val('cl-amt').trim(); if(!amt){ toast('Enter an amount'); return; } CLAIMS.unshift({id:'cl'+(CLAIMS.length+1),amt:amt,region:val('cl-reg')||'—',when:val('cl-when'),desc:val('cl-desc')||'Claim',files:(document.getElementById('cl-files').files||[]).length,st:'With Design Head',note:'',steps:[['Sent','Today',true],['Design Head','Pending',false],['MD pays','—',false]]}); S.stack=[]; S.tab='more'; S.stack.push({v:'pay'}); toast('Claim sent to the Design Head'); break; }
    case 'claim-resend': { var cr=cById(d.id); cr.note=''; cr.st='With Design Head'; cr.steps[1]=['Design Head','Pending',false]; toast('Resent after changes'); break; }
    case 'signout-dev': { DEVICES.splice(+d.i,1); toast('Signed out that device'); break; }
    case 'agenda-edit': toast('As organiser you can edit the agenda until the meeting starts'); return;
    case 'viewall': toast('Full list opens here'); return;
    default: return;
  }
  render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]'); if(!el) return;
  var a=el.dataset.a;
  if(a==='close-bg'){ if(e.target.classList.contains('sheetwrap')) closeSheet(); return; }
  if(a==='tick'){ act(a,el); return; }
  e.preventDefault();
  act(a,el);
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && S.sheet) closeSheet(); });

render();
})();
</script>
