<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First Light Client Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{
  --bg:#F7F3EE; --card:#FFFFFF; --ink:#1F2A36; --mut:#5B6672; --line:rgba(31,42,54,.12);
  --slate:#2E86C1; --slate-2:#1B5E8C; --blush:#FF8A6B; --peach:#FFC48A; --sun:#FFF1C9; --mint:#7BDCB5; --sky:#8ED1FC; --grape:#8E6CEF; --lemon:#FFE066; --rose:#FF6F91;
  --green:#2DBE84; --amber:#FFB42E; --red:#D9534F; --on-accent:#1F2A36;
  --serif:Fraunces,Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C25; --card:#1C2834; --ink:#F4EFE9; --mut:#A7B2BC; --line:rgba(244,239,233,.12);
    --slate:#4E8BAD; --slate-2:#1E3A48; --sun:#33261F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141C25; --card:#1C2834; --ink:#F4EFE9; --mut:#A7B2BC; --line:rgba(244,239,233,.12);
  --slate:#4E8BAD; --slate-2:#1E3A48; --sun:#33261F; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#FFE7C7 0%,#CFEBFF 50%,#FFD3E1 100%);color:var(--ink);font:400 15px/1.5 var(--sans);
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
@media (prefers-color-scheme: dark){ body:not([data-theme="light"]){background:linear-gradient(160deg,#0E151C 0%,#1A2A36 60%,#3A2A2A 100%)} }
body[data-theme="dark"]{background:linear-gradient(160deg,#0E151C 0%,#1A2A36 60%,#3A2A2A 100%)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--slate);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15;text-wrap:balance}
p{margin:0;text-wrap:pretty}

/* device */
.device{width:min(100vw,400px);height:min(100dvh,860px);background:var(--bg);border-radius:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media (min-width:520px){ .device{border-radius:36px;box-shadow:0 30px 80px -20px rgba(31,42,54,.45),0 0 0 10px #1F2A36;height:min(calc(100dvh - 40px),844px)} }
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 8px) max(16px,env(safe-area-inset-right,0px)) 96px max(16px,env(safe-area-inset-left,0px));scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.screen.noscroll{padding-bottom:16px}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;margin-bottom:10px}
.bar h2{font-size:19px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;transition:transform .15s}
.ibtn:active{transform:scale(.95)}
.ibtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spacer{width:40px;flex:none}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 8px) max(10px,env(safe-area-inset-left,0px));background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font:500 11px var(--sans);transition:background .2s,color .2s}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--slate);background:color-mix(in srgb,var(--slate) 14%,transparent)}

/* cards and rows */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 1px 0 var(--line),0 12px 28px -22px rgba(31,42,54,.35)}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lbl{font:500 11px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.muted{color:var(--mut)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 0 10px}
.sec a,.sec button.link{font:500 13px var(--sans);color:var(--slate);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font:500 12px/1 var(--sans);background:var(--sun);color:var(--ink);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.g{background:#3F9E6B}.a{background:#E0A526}.r{background:#D9534F}.s{background:var(--slate)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:500 13px var(--sans);transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:12px;border:1px solid transparent;font:500 15px var(--sans);transition:transform .15s,background .2s,opacity .2s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-pri{background:var(--blush);color:var(--on-accent)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-sm{width:auto;padding:9px 14px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:10px}
.btn-row>*{flex:1}
input.field,select.field,textarea.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:500 16px var(--sans);color:var(--ink);min-width:0}
input.field:focus,textarea.field:focus,select.field:focus{outline:2px solid var(--slate);outline-offset:1px;border-color:transparent}
label.fl{display:grid;gap:7px;font:500 13px var(--sans);color:var(--mut)}
.hint{font-size:12px;color:var(--mut)}
.err{color:var(--red);font:500 13px var(--sans);min-height:1.3em}
.ok{color:var(--green);font:500 13px var(--sans)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--slate);flex:none}
a.textlink{color:var(--slate);font-weight:600}

/* hero and illustrations */
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:210px;color:#fff;background:var(--slate);isolation:isolate}
.hero-art{position:absolute;inset:0;border-radius:20px;overflow:hidden}
.hero-art svg{width:100%;height:100%;display:block}
svg{max-width:100%}
.hero .cap{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;align-items:end;gap:10px;font:500 13px var(--sans)}
.hero .cap b{font:500 16px var(--serif);display:block}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45);display:inline-block;transition:width .3s,background .3s}
.dots i.on{width:20px;border-radius:4px;background:#fff}
.thumb{height:120px;border-radius:14px;overflow:hidden;position:relative;flex:none}
.thumb svg{width:100%;height:100%;display:block}
.thumb .tag{position:absolute;left:8px;bottom:8px;background:rgba(255,255,255,.9);color:#1F2A36;padding:4px 8px;border-radius:8px;font:500 11px var(--sans)}

/* stages */
.stages{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;scroll-snap-type:x mandatory}
.stages::-webkit-scrollbar{display:none}
.stg{flex:none;width:118px;scroll-snap-align:start;background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);text-align:left;color:var(--ink);transition:transform .2s}
.stg:active{transform:scale(.97)}
.stg small{display:block;color:var(--mut);font-size:11px;margin-top:4px}
.stg.done{opacity:.9}
.stg.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stg.now small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.stg.next{border-style:dashed;color:var(--mut)}
.stg b{font:500 14px var(--sans)}
.stg .tick{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12px;margin-bottom:8px}

/* payments */
.owed{background:linear-gradient(135deg,var(--slate),var(--slate-2));color:#fff;border-radius:18px;padding:18px}
.owed .big{font:500 34px/1.1 var(--sans);font-variant-numeric:tabular-nums;margin-top:6px}
.bars{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line);margin-top:14px}
.bars i{display:block;height:100%}
.split{display:grid;gap:8px;margin-top:10px}
.split div{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.gridicons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gridicons button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;display:grid;justify-items:center;gap:6px;font:500 12px var(--sans);color:var(--ink)}
.gridicons svg{width:22px;height:22px;stroke:var(--slate);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(20,28,37,.42);z-index:20;animation:fadeIn .25s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:21;animation:up .32s cubic-bezier(.2,.7,.2,1) both;box-shadow:0 -20px 50px -20px rgba(0,0,0,.35)}
.sheet.still{animation:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet .x{position:absolute;right:12px;top:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.viewer{position:absolute;inset:0;background:#0E151C;z-index:30;display:flex;flex-direction:column;color:#fff;animation:fadeIn .25s ease both}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:8px}
.viewer .stageimg{flex:1;display:grid;place-items:center;padding:12px}
.viewer .stageimg svg{width:100%;max-height:100%;border-radius:16px}
.viewer .vfoot{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 24px;font-size:14px}

/* toast */
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font:500 14px var(--sans);z-index:40;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);max-width:88%;text-align:center;animation:toastin .3s ease both}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* screen transition */
.enter{animation:enter .38s cubic-bezier(.2,.7,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* sign-in */
.auth{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-top:6px}
.brandmark{font:500 22px var(--serif);display:flex;align-items:center;gap:10px}
.brandmark i{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--blush),var(--peach));display:inline-block}
.otpbox{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otpbox input{text-align:center;font:500 22px var(--sans);padding:12px 0;font-variant-numeric:tabular-nums}
.aside{background:linear-gradient(145deg,var(--slate),var(--slate-2));color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.aside p{opacity:.9;font-size:14px;margin-top:6px}

/* messages */
.msg{max-width:82%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.45;background:var(--card);box-shadow:0 1px 0 var(--line)}
.msg.me{margin-left:auto;background:var(--slate);color:#fff}
.msg small{display:block;font-size:11px;opacity:.7;margin-bottom:2px}
.thread{display:flex;flex-direction:column;gap:8px}
.composer{position:absolute;left:0;right:0;bottom:70px;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;z-index:6}
.composer input{flex:1}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:500 16px var(--serif);color:var(--ink);flex:none}

/* catalogue */
.item{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line);text-align:left;color:var(--ink);padding:0;display:grid;grid-template-columns:110px 1fr;transition:transform .2s;border:0;width:100%}
.item:active{transform:scale(.99)}
.item .pic{min-height:104px}
.item .pic svg{width:100%;height:100%;display:block}
.item .txt{padding:12px 14px;display:grid;gap:4px;align-content:center;min-width:0}
.item .txt b{font:500 15px var(--sans)}
.item .txt span{font-size:13px;color:var(--mut)}
.grid2{display:grid;gap:12px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:none;width:200px;background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 1px 0 var(--line);text-align:left;border:0;padding:0;color:var(--ink);scroll-snap-align:start}
.hcard .thumb{height:132px;border-radius:0}
.hcard .body{padding:10px 12px}
.hcard b{display:block;font:500 14px var(--sans)}
.hcard span{font-size:12px;color:var(--mut)}

/* designs */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rgrid button{border:0;padding:0;background:none;border-radius:14px;overflow:hidden;position:relative;text-align:left;color:var(--ink)}
.rgrid button.wide{grid-column:span 2}
.rgrid button .thumb{height:140px}
.rgrid button.wide .thumb{height:170px}
.vchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.vchips::-webkit-scrollbar{display:none}

/* site */
.site .hero-site{position:relative;border-radius:24px;overflow:hidden;background:linear-gradient(150deg,var(--slate),#2D5770 55%,var(--peach));color:#fff;padding:22px 20px 20px;min-height:360px;display:flex;flex-direction:column;justify-content:flex-end}
.site .obj{position:absolute;right:-70px;top:-24px;width:190px;height:190px;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.site .obj:hover,.site .obj.tilt{transform:rotate(12deg) scale(1.06)}
.site .float{animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.site .hero-site h1{font-size:34px}
.site .hero-site p{opacity:.92;margin-top:10px;font-size:15px}
.choices{display:grid;gap:10px;margin-top:14px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:0;text-align:left;color:var(--ink);box-shadow:0 1px 0 var(--line);transition:transform .2s}
.choice:active{transform:scale(.99)}
.choice b{font:500 15px var(--sans);display:block}
.choice span{font-size:13px;color:var(--mut)}
.choice .go{width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center;flex:none;font-size:16px}
input[type=range]{width:100%;accent-color:var(--slate)}

/* timeline */
.tl{position:relative;padding-left:26px;display:grid;gap:16px;margin-top:6px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl>div{position:relative}
.tl>div::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--slate)}
.tl>div.done::before{background:var(--green);border-color:var(--green)}
.tl>div.now::before{background:var(--amber);border-color:var(--amber)}
.tl b{display:block;font:500 14px var(--sans)}
.tl span{font-size:13px;color:var(--mut)}

/* spinner pulse for "waiting" */
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

b{font-weight:500}
h1,h2,h3{font-weight:400}
.curstage{position:relative;border-radius:22px;overflow:hidden;color:#fff;background:linear-gradient(135deg,#FF8A6B,#FF6F91 55%,#8E6CEF);padding:18px;box-shadow:0 18px 36px -18px rgba(255,111,145,.7)}
.curstage .ttl{font:400 28px/1.1 var(--serif);margin-top:6px}
.curstage .meta{font-size:13px;opacity:.95;margin-top:6px}
.curstage .bar2{height:10px;border-radius:999px;background:rgba(255,255,255,.35);margin-top:14px;overflow:hidden}
.curstage .bar2 i{display:block;height:100%;width:var(--w,50%);background:#FFE066;border-radius:999px}
.curstage .pic{position:absolute;right:-14px;top:-14px;width:120px;height:120px;opacity:.95}
.curstage .go{margin-top:14px;display:inline-flex;gap:8px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:10px 16px;font:500 14px var(--sans)}
.stgico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:10px}
.stgico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage-hero-art{border-radius:18px;overflow:hidden;height:150px}
.stage-hero-art svg{width:100%;height:100%;display:block}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.calgrid .dow{font:500 11px var(--sans);color:var(--mut);padding:4px 0}
.calgrid button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;font:500 14px var(--sans);color:var(--ink);display:grid;place-items:center;padding:0}
.calgrid button:disabled{color:var(--mut);opacity:.35;cursor:not-allowed}
.calgrid button[aria-pressed="true"]{background:var(--slate);color:#fff}
.calgrid button.today{box-shadow:inset 0 0 0 2px var(--slate)}
.ampm{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);padding:4px;border-radius:12px}
.ampm button{border:0;border-radius:9px;padding:10px;background:transparent;font:500 14px var(--sans);color:var(--mut)}
.ampm button[aria-pressed="true"]{background:var(--slate);color:#fff}
.clockwrap{display:grid;place-items:center}
.clockwrap svg{width:min(250px,78vw);height:auto;display:block}
.clock-num{cursor:pointer}
.clock-num circle{fill:var(--card);stroke:var(--line);stroke-width:1.5;transition:fill .2s}
.clock-num text{font:500 16px var(--sans);fill:var(--ink);pointer-events:none}
.clock-num.on circle{fill:var(--slate);stroke:var(--slate)}
.clock-num.on text{fill:#fff}
a.tel{text-decoration:none}

.topbar{display:none;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);flex:none}
.topbar.on{display:flex}
.logo{display:flex;align-items:center;gap:10px;font:600 14px var(--sans);letter-spacing:.08em;min-width:0}
.logo .mk{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#FF8A6B,#FF6F91 60%,#8E6CEF);display:grid;place-items:center;color:#fff;font:400 18px var(--serif);flex:none}
.topicons{display:flex;gap:8px;flex:none}
.fico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none}
.fico svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

function paidTotal(){ return S.pays.filter(function(p){return p.status==='paid';}).reduce(function(a,p){return a+TOTAL*p.pct/100;},0); }
function amtOf(p){ return TOTAL*p.pct/100; }
function remaining(){ return TOTAL - paidTotal(); }
function lightFor(days){ return days<=0?'s':(days<=3?'r':(days<=6?'a':'g')); }
function toast(msg){
  var old=document.querySelector('.toast'); if(old) old.remove();
  var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg;
  document.getElementById('device').appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); },2400);
}
function go(name, opts){
  if(name!==S.screen){ S.prev=S.screen; }
  S.screen=name; S.sheet=null;
  if(opts&&opts.tab){ S.tab=opts.tab; }
  if(name==='signin'||name==='site'||name==='terms'&&!S.auth){ /* public-ish */ }
  draw(true);
  var sc=document.getElementById('screen'); if(sc) sc.scrollTop=0;
}

  }

    '<h2>Request a new time</h2><p class="muted" style="margin-top:4px">Pick a date and an hour. Everyone tagged in the meeting must confirm.</p>'+
    '<div class="card" style="margin-top:14px">'+calHtml(c)+'</div>'+
    '<div class="card" style="margin-top:12px;display:grid;gap:12px;justify-items:center"><span class="lbl" style="justify-self:start">Time</span>'+clockHtml(c)+
      '<div class="ampm" role="group" aria-label="AM or PM" style="width:100%"><button data-a="ampm" data-v="AM" aria-pressed="'+(c.ap==='AM')+'">AM</button><button data-a="ampm" data-v="PM" aria-pressed="'+(c.ap==='PM')+'">PM</button></div></div>'+
    '<p style="margin-top:12px;text-align:center;font:500 16px var(--sans)">'+esc(readout)+'</p>'+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-line" data-a="close-sheet">Cancel</button><button class="btn btn-pri" data-a="send-change">Send request</button></div>'+
  '</div>';
};
SHEETS.call = function(d){
  var num=d.tel||'+91 98xxx xxxxx';
  return '<div class="sheet" role="dialog" aria-label="Call"><div class="grab"></div><button class="ibtn x" data-a="close-sheet" aria-label="Close">'+I.close+'</button>'+
    '<span class="lbl">Call</span><h2 style="margin-top:6px">'+esc(d.n||'Neha')+'</h2><p class="muted" style="margin-top:4px">'+(d.n==='Imran'?'Production manager':(d.n==='Arjun'?'Design partner':'Sales representative'))+'</p>'+
    '<div class="card" style="margin-top:14px;display:grid;gap:10px"><span class="lbl">Number</span><b style="font-size:22px">'+esc(num)+'</b></div>'+
    '<div style="display:grid;gap:10px;margin-top:14px"><button class="btn btn-pri" data-a="copy-num" data-t="'+esc(num)+'">Copy number</button>'+
    '<a class="wa" href="https://wa.me/'+esc(num.replace(/\\D/g,''))+'" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3zm0 1.7a7.3 7.3 0 1 1-3.8 13.6l-.3-.2-2.7.7.7-2.6-.2-.3A7.3 7.3 0 0 1 12 4.7z"/></svg>Call on WhatsApp</a>'+
    '<p class="hint" style="text-align:center">Phone dialling needs the installed app. Copy the number to dial it from here.</p></div>'+
  '</div>';
};
SHEETS.entry = function(d){
  var it=itemById(d.id); if(!it) return '';
  var full=!!S.entryFull;
  return '<div class="sheet" role="dialog" aria-label="'+esc(it.name)+'"><div class="grab"></div><button class="ibtn x" data-a="close-sheet" aria-label="Close">'+I.close+'</button>'+
    '<div style="border-radius:16px;overflow:hidden;'+(full?'height:300px':'height:190px')+';transition:height .3s">'+art(it.hue==='slate'?'bedroom':(it.room==='Kitchen'?'kitchen':'living'))+'</div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="lbl">'+esc(it.room)+'</span><button class="btn btn-line btn-sm" data-a="fullscreen">'+(full?'Smaller':'Full screen')+'</button></div>'+
    '<h2 style="margin-top:6px">'+esc(it.name)+'</h2>'+
    '<p class="muted" style="margin-top:6px">'+esc(it.desc)+'</p>'+
    '<div class="card" style="margin-top:12px"><div class="row"><span>Typical timeline</span><b class="num">'+it.days+' days</b></div><div class="row" style="border:0"><span>Example price</span><b class="num">'+R(it.price)+'</b></div></div>'+
    '<p class="hint" style="margin-top:8px">Lead time is a placeholder until the catalogue supplies it. Prices are examples.</p>'+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-line" data-a="share-copy" data-id="'+it.id+'">Copy link</button><a class="btn btn-pri" href="https://wa.me/?text='+encodeURIComponent('First Light · '+it.name)+'" target="_blank" rel="noopener" style="text-decoration:none">Share on WhatsApp</a></div>'+
    '<button class="btn btn-dark" style="margin-top:10px" data-a="enquire" data-id="'+it.id+'">Ask about this package</button>'+
  '</div>';

SHEETS.viewer = function(d){ return ''; };

/* viewer (full screen renders) */
function viewerHtml(){
  var r=RENDERS.filter(function(x){return x.id===S.viewer;})[0]; if(!r) return '';
  var idx=RENDERS.indexOf(r);
  return '<div class="viewer" role="dialog" aria-label="'+esc(r.name)+'"><div class="vbar"><button class="ibtn" data-a="close-viewer" aria-label="Close" style="background:#1C2834;border-color:#1C2834">'+I.close+'</button><span style="font:500 15px var(--sans)">'+esc(r.name)+'</span><span class="pill" style="background:#33261F;color:#F4EFE9">Version '+r.v+'</span></div>'+
    '<div class="stageimg">'+art(r.kind)+'</div>'+
    '<div class="vfoot"><button class="btn btn-line btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3);width:auto" data-a="viewer-prev">Previous</button><button class="btn btn-line btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3);width:auto" data-a="download" data-id="'+r.id+'">Download</button><button class="btn btn-line btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3);width:auto" data-a="viewer-next">Next</button></div></div>';
}

/* ---------- tabs ---------- */
function tabsHtml(){
  var t=[['home','Home',I.home],['project','Projects',I.proj],['meet','Meetings',I.cal],['msg','Messages',I.chat],['cat','Catalogue',I.cat]];
  var cur={signin:null,site:null,terms:null}[S.screen];
  var sc=S.screen;
  var map={home:'home',project:'project',payments:'project',schedule:'project',receipts:'project',quote:'project',invoice:'project',proof:'project',designs:'project',meetings:'meet',messages:'msg',catalogue:'cat',settings:'home',team:'home',terms:'home'};
  var active = map[sc] || null;
  return t.map(function(x){ return '<button data-a="tab" data-t="'+x[0]+'" '+(active===x[0]?'aria-current="page"':'')+'>'+x[2]+'<span>'+x[1]+'</span></button>'; }).join('');
}

/* ---------- drawing ---------- */
function draw(anim){
  var sc=document.getElementById('screen');
  var tabs=document.getElementById('tabs');
  var page = S.screen;
  var fn = SCREENS[page] || SCREENS.home;
  var hidden = (page==='signin'||page==='site'||page==='terms' && !S.auth);
  var keepScroll = !anim ? sc.scrollTop : 0;
  sc.className = 'screen' + (page==='signin'||page==='site'?' noscroll':'');
  var html = fn();
  if(!anim){ html = html.replace(/class="([^"]*)\benter\b([^"]*)"/, function(m,a,b){ return 'class="'+(a+' '+b).replace(/\s+/g,' ').trim()+'"'; }); }
  var top=document.getElementById('topbar');
  var showTop = S.auth && page!=='signin' && page!=='site';
  if(top){ top.className = 'topbar' + (showTop?' on':''); top.innerHTML = showTop ? '<div class="logo"><span class="mk">H</span>HOMESIC</div><div class="topicons"><button class="ibtn" data-a="payments" aria-label="Payments">'+I.wallet+'</button><button class="ibtn" data-a="settings" aria-label="Settings">'+I.gear+'</button></div>' : ''; }
  var sh = (S.sheet && SHEETS[S.sheet]) ? SHEETS[S.sheet](S.sheetData) : '';
  if(!anim){ sh = sh.replace('class="sheet"','class="sheet still"'); }
  sc.innerHTML = html + sh + (S.viewer?viewerHtml():'');
  if(!anim) sc.scrollTop = keepScroll;
  tabs.style.display = (S.auth && page!=='signin' && page!=='site' && page!=='terms' || (S.auth && page==='terms')) ? 'grid' : 'none';
  tabs.innerHTML = tabsHtml();
  if(page==='project'){
    var place=function(){ var strip=document.getElementById('stage-strip'); var cur=document.querySelector('.stg.now'); if(strip&&cur){ strip.style.scrollBehavior='auto'; strip.scrollLeft = cur.offsetLeft - strip.offsetLeft - 2; } };
    place(); requestAnimationFrame(place); setTimeout(place,60);
  }
  if(S.sheet==='entry'||S.sheet==='stage'||S.sheet==='payNow'||S.sheet==='change'||S.sheet==='call'||S.viewer){ sc.style.overflow = 'hidden'; } else { sc.style.overflow = 'auto'; }
  if(page==='signin' && S.sign.step==='otp'){ var f=sc.querySelector('[data-in="otp"]'); if(f && !S.sign.focused){ f.focus(); S.sign.focused=true; } }
}

/* ---------- actions ---------- */
function openSheet(name, data){ S.sheet=name; S.sheetData=data||{}; draw(false); }
function closeSheet(){ S.sheet=null; draw(false); }

function startResend(){
  S.sign.resend=30;
  clearInterval(window.__rs);
  window.__rs=setInterval(function(){
    S.sign.resend--; if(S.sign.resend<=0){ S.sign.resend=0; clearInterval(window.__rs); }
    var b=document.querySelector('[data-a="resend"]'); if(b){ b.textContent = S.sign.resend>0?'Resend in '+S.sign.resend+'s':'Resend code'; b.disabled = S.sign.resend>0; }
  },1000);
}

function act(a, el){
  var d=el.dataset;
  switch(a){
    case 'send-code': {
      var v=(document.getElementById('mob')||{}).value||''; var digits=v.replace(/\D/g,'');
      var chk=document.getElementById('terms-chk'); S.sign.terms=!!(chk&&chk.checked);
      S.sign.phone=v;
      if(digits.length<10){ S.sign.err='Enter a 10-digit mobile number.'; draw(false); return; }
      if(!S.sign.terms){ S.sign.err='Please agree to the Terms to continue.'; draw(false); return; }
      S.sign.err=''; S.sign.step='otp'; S.sign.otp='123456'; S.sign.focused=false; startResend(); toast('Prototype: demo code filled in for you'); draw(false); return;
    }
    case 'verify': {
      var code=Array.prototype.map.call(document.querySelectorAll('[data-in="otp"]'),function(i){return i.value;}).join('');
      if(code.length<6){ S.sign.err='Enter all six digits.'; draw(false); return; }
      S.auth=true; S.sign.err=''; S.sign.step='mobile'; S.tab='home'; toast('Signed in'); go('home',{tab:'home'}); return;
    }
    case 'resend': if(S.sign.resend===0){ startResend(); toast('A new code is on its way'); } return;
    case 'change-number': S.sign.step='mobile'; S.sign.err=''; draw(false); return;
    case 'settings': go('settings',{tab:'home'}); return;
    case 'go-site': go('site'); return;
    case 'go-site-auth': go('site'); return;
    case 'go-signin': go('signin'); return;
    case 'team-email': toast('Team sign-in uses your company email link. Prototype only.'); return;
    case 'terms-from-sign': S.termsFrom='sign'; go('terms'); return;
    case 'agree-terms': S.sign.terms=true; S.termsFrom=null; go('signin'); toast('Terms accepted'); return;
    case 'terms': S.termsFrom='settings'; go('terms'); return;
    case 'logout': S.auth=false; S.sign={step:'mobile',phone:'',otp:'',err:'',terms:false,resend:0,sent:false}; go('signin'); toast('Logged out'); return;
    case 'signout-device': S.devices.splice(+d.i,1); toast('Device signed out'); draw(false); return;
    case 'back': go(S.prev && S.prev!==S.screen ? S.prev : 'home'); return;
    case 'tab': tabTo(d.t); return;
    case 'cycle-hero': S.heroIdx=(S.heroIdx+1)%3; draw(false); return;
    case 'test-next': S.testIdx++; draw(false); return;
    case 'test-prev': S.testIdx=Math.max(0,S.testIdx-1); draw(false); return;
    case 'call-neha': openSheet('call',{n:'Neha',tel:'+919876500001'}); return;
    case 'go-project': go('project',{tab:'project'}); return;
    case 'go-meetings': go('meetings',{tab:'meet'}); return;
    case 'go-messages': closeSheet(); go('messages',{tab:'msg'}); return;
    case 'go-designs': S.dfilter='All'; go('designs',{tab:'project'}); return;
    case 'go-cat': go('catalogue',{tab:'cat'}); return;
    case 'payments': go('payments',{tab:'project'}); return;
    case 'receipts': go('receipts',{tab:'project'}); return;
    case 'schedule': go('schedule',{tab:'project'}); return;
    case 'quote': go('quote',{tab:'project'}); return;
    case 'invoice': go('invoice',{tab:'project'}); return;
    case 'proof': closeSheet(); go('proof',{tab:'project'}); return;
    case 'pay-sheet': openSheet('payNow'); return;
    case 'stage': openSheet('stage',{i:+d.i}); return;
    case 'close-sheet': closeSheet(); return;
    case 'send-proof': {
      if(!S.proofUrl){ toast('Add a screenshot first'); return; }
      var amt=document.getElementById('proof-amt'); S.proofAmt=amt?amt.value:S.proofAmt;
      S.proof='sent'; S.msgs.push({who:'You',t:'Payment screenshot sent for confirmation.',me:true,at:'Now'});
      toast('Sent for confirmation'); draw(false); return;
    }
    case 'sim-confirm': {
      var o=owedNow(); if(o){ o.status='paid'; 
        S.receipts.unshift({no:'R-'+(60+S.receipts.length),amt:amtOf(o),date:'Now',label:o.label});
      }
      S.proof='confirmed'; S.proofUrl=''; S.proofAmt=''; toast('Payment confirmed · receipt added'); go('payments',{tab:'project'}); return;
    }
    case 'open-item': go('catalogue',{tab:'cat'}); openSheet('entry',{id:d.id}); return;
    case 'enquire': closeSheet(); go('messages',{tab:'msg'}); toast('Enquiry noted. Sales will reply in the group.'); return;
    case 'cat-filter': S.cat.filter=d.f; draw(false); return;
    case 'fullscreen': S.entryFull=!S.entryFull; draw(false); return;
    case 'share-copy': copyText('First Light · '+(itemById(d.id)||{}).name); return;
    case 'slot': S.callSlot=d.s; S.callReq=false; draw(false); return;
    case 'ask-call': S.callReq=true; S.msgs.push({who:'You',t:'Please call me, '+S.callSlot.toLowerCase()+'.',me:true,at:'Now'}); toast('Request sent to the team'); draw(false); return;
    case 'join-group': S.joined=true; S.msgs.push({who:'Arjun',t:'Welcome to the Villa 4B group.',me:false,at:'Now'}); toast('You joined the project group'); draw(false); return;
    case 'join': toast('The meeting link opens Google Meet on your phone. Prototype only.'); return;
    case 'change-sheet': S.sheetData={}; openSheet('change'); return;
    case 'cal-day': { var v1=sheetVals(); S.sheetData={m:v1.m,d:+d.d,h:v1.h,ap:v1.ap}; draw(false); return; }
    case 'cal-prev': { var v2=sheetVals(); var m2=Math.max(10,v2.m-1); S.sheetData={m:m2,d:(m2===10?26:1),h:v2.h,ap:v2.ap}; draw(false); return; }
    case 'cal-next': { var v3=sheetVals(); var m3=Math.min(11,v3.m+1); S.sheetData={m:m3,d:(m3===10?26:1),h:v3.h,ap:v3.ap}; draw(false); return; }
    case 'clock-hour': { var v4=sheetVals(); S.sheetData={m:v4.m,d:v4.d,h:+d.h,ap:v4.ap}; draw(false); return; }
    case 'ampm': { var v5=sheetVals(); S.sheetData={m:v5.m,d:v5.d,h:v5.h,ap:d.v}; draw(false); return; }
    case 'send-change': {
      var v6=sheetVals();
      var label=new Date(2026,v6.m,v6.d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      S.change={date:label, time:v6.h+':00 '+v6.ap, conf:[], final:false};
      closeSheet(); toast('Request sent to everyone tagged'); go('meetings',{tab:'meet'}); return;
    }
    case 'confirm-change': {
      if(!S.change || S.change.conf.indexOf('You')>-1) return;
      S.change.conf.push('You'); draw(false);
      /* prototype only: the team's confirmations arrive from their own apps */
      var ch=S.change;
      setTimeout(function(){ if(S.change===ch && ch.conf.indexOf('Arjun')<0){ ch.conf.push('Arjun'); if(S.screen==='meetings') draw(false); } },1400);
      setTimeout(function(){ if(S.change===ch && ch.conf.indexOf('Imran')<0){ ch.conf.push('Imran'); if(ch.conf.length===3){ ch.final=true; NEXT_MEET.date=ch.date; NEXT_MEET.time=ch.time; toast('Everyone confirmed. The new time is final.'); } if(S.screen==='meetings') draw(false); } },2800);
      return;
    }
    case 'viewer': S.viewer=d.id; draw(false); return;
    case 'close-viewer': S.viewer=null; draw(false); return;
    case 'viewer-next': { var i1=RENDERS.map(function(r){return r.id;}).indexOf(S.viewer); S.viewer=RENDERS[(i1+1)%RENDERS.length].id; draw(false); return; }
    case 'viewer-prev': { var i2=RENDERS.map(function(r){return r.id;}).indexOf(S.viewer); S.viewer=RENDERS[(i2-1+RENDERS.length)%RENDERS.length].id; draw(false); return; }
    case 'design-v': S.designFilter=+d.v; draw(false); return;
    case 'dcat': S.dfilter=d.c; draw(false); return;
    case 'files-cat': S.dfilter=d.c; go('designs',{tab:'project'}); return;
    case 'download': toast('Downloads start from the installed app. This preview cannot save files.'); return;
    case 'call': openSheet('call',{n:d.n,tel:d.tel}); return;
    case 'copy-num': copyText(d.t||'+91 98xxx xxxxx'); return;
    case 'team': S.teamId=d.id; go('team'); return;
    case 'site-team': S.teamId='arjun'; go('team'); return;
    case 'tilt': S.site.tilt=!S.site.tilt; draw(false); return;
    case 'book': openSheet('book'); return;
    case 'visit': toast('The studio address is shared in your confirmation. Placeholder.'); return;
    case 'budget': openSheet('budget'); return;
    case 'send-book': S.site.bookOk=true; closeSheet(); toast('Thank you. A designer will call you back.'); return;
    case 'send-budget': closeSheet(); toast('Thanks. We will plan around '+R(S.site.budget*100000)+'.'); return;
    case 'close-book': closeSheet(); return;
    case 'proof-pick': return;
    default: return;
  }
}
function copyText(t){
  try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(function(){toast('Copied');},function(){toast('Select the text to copy it');}); return; } }catch(e){}
  toast('Select the text to copy it');
}

/* sheets that need their own markup */
SHEETS.book = function(){
  return '<div class="sheet" role="dialog" aria-label="Book a call"><div class="grab"></div><button class="ibtn x" data-a="close-book" aria-label="Close">'+I.close+'</button>'+
    '<h2>Book a call</h2><p class="muted" style="margin-top:4px">A designer calls at the time you choose.</p>'+
    '<form data-form="book" style="display:grid;gap:12px;margin-top:14px"><label class="fl">Name<input class="field" name="name" required placeholder="Your name"></label><label class="fl">Mobile number<input class="field" name="mob" type="tel" inputmode="tel" required placeholder="+91 98xxx xxxxx"></label><label class="fl">Best time<select class="field" name="when"><option>Today, 4 pm</option><option>Tomorrow, 11 am</option><option>This weekend</option></select></label><button class="btn btn-pri" type="submit">Request the call</button></form></div>';
};
SHEETS.budget = function(){
  var v=S.site.budget;
  return '<div class="sheet" role="dialog" aria-label="Try my budget"><div class="grab"></div><button class="ibtn x" data-a="close-sheet" aria-label="Close">'+I.close+'</button>'+
    '<h2>Try my budget</h2><p class="muted" style="margin-top:4px">A rough figure helps us plan the first call. It is not a quotation.</p>'+
    '<div class="card" style="margin-top:14px;display:grid;gap:8px"><span class="lbl">Rough budget</span><b class="num" style="font-size:24px" id="bud-v">'+R(v*100000)+'</b><input type="range" min="5" max="50" step="1" value="'+v+'" data-in="budget" aria-label="Budget in lakhs"></div>'+
    '<div class="btn-row" style="margin-top:14px"><button class="btn btn-line" data-a="close-sheet">Cancel</button><button class="btn btn-pri" data-a="send-budget">Plan with this</button></div>'+
  '</div>';
};

/* ---------- inputs & forms (delegated) ---------- */
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-a]');
  if(!t) return;
  if(t.tagName==='A' && t.getAttribute('target')==='_blank') return;
  if(t.tagName==='A' && (t.getAttribute('href')||'').indexOf('tel:')===0) return;
  if(t.tagName==='A') e.preventDefault();
  if(t.disabled) return;
  act(t.getAttribute('data-a'), t);
});
document.addEventListener('submit', function(e){
  var f=e.target; e.preventDefault();
  var kind=f.getAttribute('data-form');
  if(kind==='book'){ S.site.bookOk=true; closeSheet(); toast('Thank you. A designer will call you back.'); return; }
  if(kind==='msg'){ var v=(document.getElementById('msg-in')||{}).value||''; if(!v.trim()) return; S.msgs.push({who:'You',t:v.trim(),me:true,at:'Now'}); draw(false); setTimeout(function(){ var s=document.getElementById('screen'); if(s) s.scrollTop=s.scrollHeight; },0); return; }
});
document.addEventListener('input', function(e){
  var el=e.target, k=el.getAttribute('data-in');
  if(!k) return;
  if(k==='q'){
    S.cat.q=el.value;
    var list=document.getElementById('cat-list'); if(list) list.innerHTML=catList();
    return;
  }
  if(k==='budget'){ S.site.budget=+el.value; var b=document.getElementById('bud-v'); if(b) b.textContent=R(S.site.budget*100000); return; }
  if(k==='amt'){ S.proofAmt=el.value; return; }
  if(k==='otp'){
    var i=+el.getAttribute('data-i');
    el.value=el.value.replace(/\D/g,'').slice(-1);
    var inputs=document.querySelectorAll('[data-in="otp"]');
    var arr=[]; inputs.forEach(function(x){arr.push(x.value);});
    S.sign.otp=arr.join('');
    if(el.value && inputs[i+1]) inputs[i+1].focus();
    return;
  }
});
document.addEventListener('change', function(e){
  var el=e.target, k=el.getAttribute('data-in');
  if(k==='file' && el.files && el.files[0]){
    try{ if(S.proofUrl) URL.revokeObjectURL(S.proofUrl); }catch(err){}
    S.proofUrl = URL.createObjectURL(el.files[0]); S.proof='none'; draw(false);
  }
  if(el.id==='mob'){ S.sign.phone=el.value; }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.getAttribute && e.target.getAttribute('data-in')==='otp'){ act('verify', e.target); }
  if(e.key==='Escape'){ if(S.viewer){S.viewer=null;draw(false);} else if(S.sheet){closeSheet();} }
});

/* ---------- init ---------- */
if(S.screen==='signin'){ /* default */ }
draw(true);
})();
</script>
